name: Admin foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies for high-severity vulnerabilities
        run: pnpm audit --prod --audit-level high --json > pnpm-audit.json
      - name: Archive production dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-production-pnpm-audit
          path: pnpm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify installed dependencies match committed lockfile
        run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-test production admin liveness and deny unknown routes
        run: |
          pnpm start --hostname 127.0.0.1 --port 3102 > "$RUNNER_TEMP/services-admin.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 3 --fail --silent http://127.0.0.1:3102/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3102/api/health | grep -q .
          test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' -I http://127.0.0.1:3102/api/health)" = 200
          curl --connect-timeout 2 --max-time 5 --fail --silent -I http://127.0.0.1:3102/api/health > "$RUNNER_TEMP/admin-health-head-headers.txt"
          grep -Eiq '^cache-control:.*no-store' "$RUNNER_TEMP/admin-health-head-headers.txt"
          grep -Eiq '^x-content-type-options:.*nosniff' "$RUNNER_TEMP/admin-health-head-headers.txt"
          grep -Eiq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/admin-health-head-headers.txt"
          curl --connect-timeout 2 --max-time 5 --fail --silent -D "$RUNNER_TEMP/admin-health-headers.txt" -o /dev/null http://127.0.0.1:3102/api/health
          grep -Eiq '^cache-control:.*no-store' "$RUNNER_TEMP/admin-health-headers.txt"
          grep -Eiq '^x-content-type-options:.*nosniff' "$RUNNER_TEMP/admin-health-headers.txt"
          grep -Eiq '^x-frame-options:.*DENY' "$RUNNER_TEMP/admin-health-headers.txt"
          grep -Eiq '^referrer-policy:.*no-referrer' "$RUNNER_TEMP/admin-health-headers.txt"
          grep -Eiq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/admin-health-headers.txt"
          grep -Eiq '^content-security-policy:.*frame-ancestors' "$RUNNER_TEMP/admin-health-headers.txt"
          test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3102/ci-unknown-admin-route)" = 404
          # Private workspace must never render logout UI without a valid session.
          curl --connect-timeout 2 --max-time 5 --silent http://127.0.0.1:3102/moderation > "$RUNNER_TEMP/admin-private-denied.html"
          if grep -q 'Жүйеден шығу' "$RUNNER_TEMP/admin-private-denied.html"; then
            echo 'Private logout UI leaked on unauthenticated moderation route'
            exit 1
          fi
          # The server-rendered moderation workspace must also be fail-closed.
          test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3102/moderation)" = 404
          # Logout must not be exposed before authenticated session rollout.
          test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3102/api/auth/logout)" = 404
          # Private moderation BFF must stay unavailable without explicit rollout.
          test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3102/api/moderation/cases)" = 404
          curl --connect-timeout 2 --max-time 5 --silent -D "$RUNNER_TEMP/admin-moderation-headers.txt" -o /dev/null http://127.0.0.1:3102/api/moderation/cases
          grep -Eiq '^cache-control:.*no-store' "$RUNNER_TEMP/admin-moderation-headers.txt"
          grep -Eiq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/admin-moderation-headers.txt"
          curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3102/ > "$RUNNER_TEMP/admin-root.html"
          grep -q 'Әкімшілік панель әзірленуде' "$RUNNER_TEMP/admin-root.html"
          if grep -Eiq '<form([[:space:]>])|<input([[:space:]>])' "$RUNNER_TEMP/admin-root.html"; then
            echo 'Admin root unexpectedly exposes an input or login form before MFA rollout'
            exit 1
          fi
      - name: Smoke-test enabled admin BFF still denies missing or forged sessions
        env:
          SERVICES_ADMIN_ENABLE_MODERATION_BFF: enabled
        run: |
          pnpm start --hostname 127.0.0.1 --port 3103 > "$RUNNER_TEMP/services-admin-enabled.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --connect-timeout 2 --max-time 3 --fail --silent http://127.0.0.1:3103/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3103/api/health | grep -q .
          # Enabled flag alone must not grant access; backend secrets and valid MFA session are absent.
          for route in /moderation /api/moderation/cases; do
            test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' "http://127.0.0.1:3103$route")" = 404
            test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' -H 'Cookie: __Host-services-admin-session=forged' "http://127.0.0.1:3103$route")" = 404
            test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' -H 'Origin: https://attacker.example' "http://127.0.0.1:3103$route")" = 404
          done
          # Unknown Fetch Metadata values must never grant access to privileged routes.
          for site in cross-site same-site invalid; do
            for route in /moderation /api/moderation/cases; do
              test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' -H "Sec-Fetch-Site: $site" "http://127.0.0.1:3103$route")" = 404
            done
          done
          test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:3103' http://127.0.0.1:3103/api/auth/logout)" = 404
          test "$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://attacker.example' http://127.0.0.1:3103/api/auth/logout)" = 404
      - name: Print admin server diagnostics on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/services-admin.log" ]; then tail -n 120 "$RUNNER_TEMP/services-admin.log"; fi
          if [ -f "$RUNNER_TEMP/services-admin-enabled.log" ]; then tail -n 120 "$RUNNER_TEMP/services-admin-enabled.log"; fi
