name: Admin foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies for high-severity vulnerabilities
        run: pnpm audit --prod --audit-level high --json > pnpm-audit.json
      - name: Archive production dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-production-pnpm-audit
          path: pnpm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify installed dependencies match committed lockfile
        run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
